<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Central Medical Shield & Syringe Graphic -->
  <g filter="url(#shadow)">
    <!-- White Circle Container -->
    <circle cx="256" cy="230" r="130" fill="#ffffff" />
    
    <!-- Injection Syringe Icon -->
    <g transform="translate(166, 140) scale(0.7)">
      <!-- Needle Tip -->
      <line x1="210" y1="50" x2="250" y2="10" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
      
      <!-- Syringe Body -->
      <rect x="80" y="80" width="130" height="70" rx="8" transform="rotate(45 145 115)" fill="#eff6ff" stroke="#2563eb" stroke-width="8" />
      
      <!-- Liquid Level inside Syringe -->
      <path d="M 125,75 L 175,125 L 140,160 L 90,110 Z" fill="#2563eb" fill-opacity="0.8" />
      
      <!-- Measurement ticks -->
      <line x1="120" y1="100" x2="135" y2="85" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />
      <line x1="135" y1="115" x2="150" y2="100" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />
      <line x1="150" y1="130" x2="165" y2="115" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />

      <!-- Plunger -->
      <line x1="90" y1="170" x2="50" y2="210" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />
      <line x1="30" y1="210" x2="70" y2="250" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
    </g>

    <!-- Medical Cross Badge -->
    <circle cx="330" cy="300" r="32" fill="#16a34a" />
    <path d="M 330,285 L 330,315 M 315,300 L 345,300" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- VYVGART Brand Text -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">SUIVI VYVGART</text>
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="2">TRAÇABILITÉ MÉDICALE</text>
</svg>
